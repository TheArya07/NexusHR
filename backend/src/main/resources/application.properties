
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nexushr
spring.datasource.username=aryankumar
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Temporarily disable OpenAI auto-configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false
spring.ai.openai.image.enabled=false

management.endpoints.web.exposure.include=health

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=43200000